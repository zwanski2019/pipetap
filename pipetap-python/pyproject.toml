[project]
name = "pipetap"
version = "1.0.0"
description = "A python PipeTap client"
readme = "README.md"
authors = [
    { name = "Leon Jacobs", email = "leonja511@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
requires-python = ">=3"
license = { file = "LICENSE" }
dependencies = []

[project.urls]
Homepage = "https://github.com/sensepost/pipetap"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
