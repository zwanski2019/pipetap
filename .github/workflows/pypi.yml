name: Release

on:
  push:
    tags:
      - '*'

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Set tagged version
        run: |
          VERSION="$GITHUB_REF_NAME"
          uv version "$VERSION"
      - name: Build
        run: uv build
      - name: Publish
        run: uv publish
